# Four Eyes control policy. Always read from main (origin/main), never from the PR being judged.

closed_through: "2026-08-31"                          # last closed accounting period
ticket_regex: "\\b(CHG|FIN)-\\d{4}-\\d{3,5}\\b"        # change ticket required for Tier 1 and 2
finance_path: models/marts/finance/
control_plane_paths: [".github/", "controls/", "four_eyes/"]

# Aggregates compared between production and the PR's CI build, by period.
impact_probes:
  - model: fct_net_transaction_revenue
    keys: [trade_month, product]
    period: trade_month
    measure: net_revenue

default_tier: 2
tiers:
  1: { label: high,   approvals: [{ group: controllership, min: 1 }, { group: data_platform_leads, min: 1 }] }
  2: { label: medium, approvals: [{ group: data_platform_leads, min: 1 }] }
  3: { label: low,    approvals: [{ group: engineers, min: 1 }] }

# GitHub logins. Replace the placeholders with your demo approver accounts.
groups:
  controllership:      [ntungaturthy]
  data_platform_leads: [niktun]
  engineers:           [niktun, ntungaturthy]
